apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-stg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/EiconVision/eicon-gitops.git
    targetRevision: staging
    path: apps/argocd/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
