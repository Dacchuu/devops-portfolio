apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eicon-production

resources:
  - hpa.yaml
  - ../../base
  - external-secret.yaml
  - efs-storageclass.yaml
  - pvc-efs.yaml
  - pdb.yaml

replicas:
  - name: eicon-backend
    count: 2

patchesStrategicMerge:
  - disable-rate-limiting.yaml
  - probe-tuning.yaml
  - rollout-strategy.yaml
  - topology-spread.yaml
  - resources.yaml
  - node-affinity.yaml

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - DB_HOST=database-1.cslwsecwut6c.us-east-1.rds.amazonaws.com
      - DB_PORT=5432
      - DB_NAME=art_db
      - QDRANT_URL=https://ec6c011b-1952-4c6b-abe7-165df2a636df.us-east-1-1.aws.cloud.qdrant.io
      - EMBEDDING_SERVICE_URL=http://eicon-embedding
      - AWS_S3_BUCKET_NAME_IMAGES=eicon-shazam-dev-images
      - AWS_S3_BUCKET_NAME_THUMBNAILS=eicon-shazam-dev-thumbnails
      - AWS_S3_BUCKET_NAME_PROFILE_PICTURES=eicon-users-profile-pictures
      - AWS_S3_BUCKET_NAME_QUERY_IMAGES=eicon-query-images-us
      - AWS_REGION=us-east-1
      - S3_BUCKET=eicon-shazam-dev-models
      - CHECKPOINT_PATH=checkpoint.pth
      - PROMETHEUS_METRICS_ENABLED=true

# Existing us-east-1 repo, kept up to date by the EC2 "PRODUCTION DEPLOY" GitHub Actions
# workflow (build-and-push.sh) whenever it's manually triggered against main. Same image the
# live EC2 production runs.
images:
  - name: 491085416489.dkr.ecr.us-west-1.amazonaws.com/eicon-shazam-backend
    newName: 491085416489.dkr.ecr.us-east-1.amazonaws.com/eicon-shazam-backend
    newTag: "ca7a4c9"
