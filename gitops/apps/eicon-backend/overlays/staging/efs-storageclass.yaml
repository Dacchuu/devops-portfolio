apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-backend-uploads
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-0b0ccb9d50d7cad59
  directoryPerms: "750"
  gidRangeStart: "1000"
  gidRangeEnd: "2000"
  basePath: "/eicon-backend-uploads"
reclaimPolicy: Retain
volumeBindingMode: Immediate
