apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eicon-backend-hpa
  namespace: eicon-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eicon-backend
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60