apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eicon-staging

resources:
  - hpa.yaml
  - ../../base
  - external-secret.yaml
  - efs-storageclass.yaml
  - pvc-efs.yaml
  - pdb.yaml

replicas:
  - name: eicon-backend
    count: 1

patchesStrategicMerge:
  - disable-rate-limiting.yaml
  - probe-tuning.yaml
  - rollout-strategy.yaml
  - topology-spread.yaml
  - resources.yaml
  - node-affinity.yaml

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - DB_HOST=k8s-staging.creeugkcobo1.us-west-1.rds.amazonaws.com
      - DB_PORT=5432
      - DB_NAME=art_db
      - QDRANT_URL=https://a308c74f-c273-42b8-9f89-4bbb8989ecee.eu-west-2-0.aws.cloud.qdrant.io
      - EMBEDDING_SERVICE_URL=http://eicon-embedding
      - AWS_S3_BUCKET_NAME_IMAGES=eicon-shazam-staging-images
      - AWS_S3_BUCKET_NAME_THUMBNAILS=eicon-shazam-staging-thumbnails
      - AWS_S3_BUCKET_NAME_PROFILE_PICTURES=eicon-users-profile-pictures-staging
      - AWS_S3_BUCKET_NAME_QUERY_IMAGES=eicon-query-images-staging-us
      - AWS_REGION=us-west-1
      - S3_BUCKET=eicon-shazam-staging-models
      - CHECKPOINT_PATH=checkpoint.pth
      - PROMETHEUS_METRICS_ENABLED=true

# Pin image by git SHA (updated by CI in cd-deploy.yaml)
images:
  - name: 491085416489.dkr.ecr.us-west-1.amazonaws.com/eicon-shazam-backend
    newName: 491085416489.dkr.ecr.us-west-1.amazonaws.com/eicon-shazam-backend
    newTag: "1432d78"