apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eicon-production

resources:
  - ../../base
  - external-secret.yaml
  - hpa.yaml

patchesStrategicMerge:
  - tolerations.yaml
  - node-affinity.yaml

configMapGenerator:
  - name: embedding-config
    behavior: merge
    literals:
      - S3_BUCKET=eicon-shazam-dev-models
      - CHECKPOINT_PATH=checkpoint.pth
      - AWS_REGION=us-east-1

# Existing us-east-1 repo, kept up to date by the EC2 "PRODUCTION DEPLOY" GitHub Actions
# workflow (build-and-push.sh) whenever it's manually triggered against main. Same image the
# live EC2 production runs.
images:
  - name: 491085416489.dkr.ecr.us-west-1.amazonaws.com/eicon-shazam-embedding
    newName: 491085416489.dkr.ecr.us-east-1.amazonaws.com/eicon-shazam-embedding
    newTag: "ca7a4c9"
