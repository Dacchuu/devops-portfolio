apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eicon-ingress
  namespace: eicon-production
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: eicon-production
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:491085416489:certificate/524f1ab6-c7ba-464b-ab0c-337133f13755
    alb.ingress.kubernetes.io/healthcheck-path: /health

spec:
  rules:
    - host: test.eicon.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eicon-backend
                port:
                  number: 80
          - path: /embed
            pathType: Prefix
            backend:
              service:
                name: eicon-embedding
                port:
                  number: 80
