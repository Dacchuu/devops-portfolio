apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eicon-ingress
  namespace: eicon-staging
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: eicon
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-1:491085416489:certificate/11b447c4-d084-4ddc-ad99-744edb8f13ec
    alb.ingress.kubernetes.io/healthcheck-path: /health

spec:
  rules:
    - host: staging.eicon.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eicon-backend
                port:
                  number: 80
          - path: /embed
            pathType: Prefix
            backend:
              service:
                name: eicon-embedding
                port:
                  number: 80
