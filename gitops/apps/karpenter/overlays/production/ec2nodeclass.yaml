apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: production-general
spec:
  role: KarpenterNodeRole-popcorn-production-eks
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: popcorn-production-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: popcorn-production-eks
  amiSelectorTerms:
    - alias: al2023@latest
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        deleteOnTermination: true
