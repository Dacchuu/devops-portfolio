apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: staging-general
spec:
  role: KarpenterNodeRole-eicon-staging-eks
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: eicon-staging-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: eicon-staging-eks
  amiSelectorTerms:
    - alias: al2023@latest
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        deleteOnTermination: true