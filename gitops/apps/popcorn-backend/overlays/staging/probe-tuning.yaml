apiVersion: apps/v1
kind: Deployment
metadata:
  name: popcorn-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            # Allow slower boots in staging before liveness kicks in.
            # Raised from 30->60 (300s->600s budget) after load testing showed pods
            # occasionally losing the race against their own startup sequence
            # (DB+Qdrant connect/checks) under concurrent scale-up bursts.
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            timeoutSeconds: 10
            failureThreshold: 5
