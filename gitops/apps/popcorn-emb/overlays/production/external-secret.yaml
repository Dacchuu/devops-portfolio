apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: embedding-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: embedding-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: popcorn/backend/credentials
