apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: popcorn-ingress
  namespace: popcorn-production
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: popcorn-production
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: <ACM-Certificate-URL>
    alb.ingress.kubernetes.io/healthcheck-path: /health

spec:
  rules:
    - host: test.popcorn.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: popcorn-backend
                port:
                  number: 80
          - path: /embed
            pathType: Prefix
            backend:
              service:
                name: popcorn-embedding
                port:
                  number: 80
