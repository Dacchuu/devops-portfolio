apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: popcorn-root-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/popcornVision/popcorn-gitops.git
    targetRevision: staging
    path: clusters/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true