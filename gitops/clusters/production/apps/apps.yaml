apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: popcorn-backend-prod
  namespace: argocd
spec:
  project: production
  source:
    repoURL: <Repo URL>
    targetRevision: production
    path: apps/popcorn-backend/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: popcorn-production
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: popcorn-backend
      jsonPointers: [/spec/replicas]
---
