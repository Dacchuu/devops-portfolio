apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eicon-backend-prod
  namespace: argocd
spec:
  project: production
  source:
    repoURL: https://github.com/EiconVision/eicon-gitops.git
    targetRevision: production
    path: apps/eicon-backend/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: eicon-production
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: eicon-backend
      jsonPointers: [/spec/replicas]
---
